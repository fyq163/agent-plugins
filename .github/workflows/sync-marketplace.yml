name: sync-marketplace
on:
  push:
    paths:
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - ".grok-plugin/marketplace.json"
      - "plugins/*/.claude-plugin/plugin.json"
      - "plugins/*/.codex-plugin/plugin.json"
      - "scripts/generate-marketplace.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate MARKETPLACE.md
        run: python scripts/generate-marketplace.py
      - name: Commit if changed
        run: |
          if git diff --quiet MARKETPLACE.md; then
            echo "MARKETPLACE.md up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MARKETPLACE.md
          git commit -m "docs: auto-generate MARKETPLACE.md from catalogs [skip ci]"
          git push
